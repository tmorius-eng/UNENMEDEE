# Members of parliament and their ХАСХОМ asset/income declarations, weekly (Monday 03:17
# Ulaanbaatar time). The roster follows elections automatically: members who leave are
# marked inactive, new ones appear. ≈126 requests per host at 8 s each, hosts in parallel.
# Then up to 25 minutes of Шилэн данс lookups for the companies the members declared.
name: Officials & declarations sync

on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

concurrency:
  group: officials-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Forks keep the code but never run the scheduled jobs (no secrets, no Actions minutes).
    if: github.repository == 'tmorius-eng/UNENMEDEE'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Dependency install scripts never see the database secret.
        env:
          DATABASE_URL: ""
        run: npm ci

      - name: Check required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret (Settings → Secrets → Actions)."; exit 1; fi

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Sync members and declarations
        run: npm run officials:sync

      # The companies members name in their declarations (shares, lenders), looked up in Шилэн данс
      # one host at 8 s a request: 25 minutes a run, never-checked names first, then > 30 days old.
      # Uses the stored declarations, so it runs even when the roster step failed.
      - name: Look up declared companies in Шилэн данс
        if: ${{ !cancelled() }}
        run: npm run officials:companies -- --budget 25
