# GitHub disables scheduled workflows in a public repository after 60 days without activity.
# The site must keep updating for months with nobody pushing code, so every day this
# re-enables every workflow that has a schedule (itself included) through the API, which resets
# the 60-day timer. No commits are made.
#
# Daily, not monthly: GitHub drops scheduled runs of public repositories under load, and a
# monthly run that is dropped once leaves 61+ days between attempts, after which every schedule,
# this one included, is disabled and nothing can revive it without a person. The workflows are
# read from the API, so a new or renamed scheduled workflow needs no edit here.
name: Keep schedules alive

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    # Forks keep the code but never run the scheduled jobs (no secrets, no Actions minutes).
    if: github.repository == 'tmorius-eng/UNENMEDEE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-enable every scheduled workflow and fail if one stays disabled
        run: |
          set -u
          failed=0
          # id, file name and state of every workflow (manual-only ones are enabled too; harmless).
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '.workflows[] | [.id, .path, .state] | @tsv' > workflows.tsv
          if [ ! -s workflows.tsv ]; then echo "::error::no workflows listed (API or token problem)"; exit 1; fi
          while IFS=$'\t' read -r id path state; do
            case "$state" in
              disabled_manually) echo "::warning::$path is disabled by hand ($state): left alone"; continue ;;
            esac
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/enable" --silent; then
              echo "✓ $path ($state → active)"
            else
              echo "::error::could not enable $path (was $state)"; failed=$((failed + 1))
            fi
          done < workflows.tsv
          # Check the result: anything not active now (apart from a manual disable) is a problem.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '.workflows[] | select(.state != "active" and .state != "disabled_manually") | "\(.path) \(.state)"' > stuck.txt || true
          if [ -s stuck.txt ]; then
            while read -r line; do echo "::error::still not active: $line"; done < stuck.txt
            failed=$((failed + 1))
          fi
          if [ "$failed" -gt 0 ]; then exit 1; fi
          echo "✓ every workflow is active"
