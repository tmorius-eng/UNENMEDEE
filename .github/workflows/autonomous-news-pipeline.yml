# Zero-cost backend: scrape Mongolian government sites and run the AI pipeline
# (free Groq / Mistral / NVIDIA / Requesty / OpenRouter / Z.ai first, paid DeepSeek / Grok capped) every hour. GitHub Actions minutes are free on PUBLIC repositories.
name: Autonomous news pipeline

on:
  schedule:
    # Two schedules an hour apart, off the congested minute 0. GitHub drops scheduled runs of
    # public repositories under load: with one 2-hourly cron the runs came 4-7 h apart (Oct 26
    # 2026: 00:24, 07:49, 15:13 UTC). Each attempt is independent, so hourly attempts give a
    # pipeline roughly every 1-2 h; the concurrency group keeps two from overlapping.
    - cron: "17 */2 * * *"
    - cron: "47 1-23/2 * * *"
    - cron: "32 */2 * * *"
    - cron: "2 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Only these domains (comma separated, empty = all due sources)"
        required: false
        default: ""
      limit:
        description: "New articles per source"
        required: false
        default: "8"
      ai_limit:
        description: "Max articles to analyze with AI"
        required: false
        default: "60"
      days:
        description: "Backfill: also collect posts up to N days old (e.g. 30, with limit 40 and ai_limit 600). Empty = normal run."
        required: false
        default: ""

# Never run two pipelines at once (same rows, same rate limits).
concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    # Forks keep the code but never run the scheduled jobs (no secrets, no Actions minutes).
    if: github.repository == 'tmorius-eng/UNENMEDEE'
    runs-on: ubuntu-latest
    # Normal runs take 15-40 min; a 30-day backfill uses the extra time.
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Free tiers (used first). Any one of them is enough to analyze articles.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # "true" only for a key from a Google project WITHOUT billing; otherwise Gemini is skipped.
      GEMINI_FREE_TIER: ${{ vars.GEMINI_FREE_TIER }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      # Paid (optional). Capped by the budget variables below.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      # Spending limits (repository variables). Defaults: $3/month, $0.30/day, Grok 5 calls/day.
      AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}
      AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
      GROK_DAILY_MAX_CALLS: ${{ vars.GROK_DAILY_MAX_CALLS }}
      DEEPSEEK_DAILY_MAX_CALLS: ${{ vars.DEEPSEEK_DAILY_MAX_CALLS }}
      AI_TIER1_CHAIN: ${{ vars.AI_TIER1_CHAIN }}
      AI_TIER2_CHAIN: ${{ vars.AI_TIER2_CHAIN }}
      # Meta Graph API version for Facebook / Instagram posting (a version is retired ~2 years after
      # release): bump the repository variable instead of editing code.
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
      # Optional repository variables (Settings → Variables): model ids and price overrides.
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      GROK_MODEL: ${{ vars.GROK_MODEL || 'grok-4-fast' }}
      DEEPSEEK_PRICE_IN: ${{ vars.DEEPSEEK_PRICE_IN }}
      DEEPSEEK_PRICE_OUT: ${{ vars.DEEPSEEK_PRICE_OUT }}
      GROK_PRICE_IN: ${{ vars.GROK_PRICE_IN }}
      GROK_PRICE_OUT: ${{ vars.GROK_PRICE_OUT }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_DEEP_MODEL: ${{ vars.GEMINI_DEEP_MODEL }}
      REQUESTY_MODEL: ${{ vars.REQUESTY_MODEL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ZAI_MODEL: ${{ vars.ZAI_MODEL }}
      # Facebook page, Threads and Instagram posting (docs/FACEBOOK.md); all unset = the steps are skipped.
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Dependency install scripts never see a secret (a compromised package could send them out).
        env:
          DATABASE_URL: ""
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          REQUESTY_API_KEY: ""
          NVIDIA_API_KEY: ""
          MISTRAL_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ZAI_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          GROK_API_KEY: ""
          FB_PAGE_TOKEN: ""
          THREADS_TOKEN: ""
          INSTAGRAM_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DISCORD_BOT_TOKEN: ""
          DISCORD_CHANNEL_ID: ""
        # One retry: a registry hiccup must not cost an hour of news.
        run: npm ci || (sleep 60 && npm ci)

      - name: Check required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret (Settings → Secrets → Actions)."; exit 1; fi
          if [ -z "$GROQ_API_KEY$GEMINI_API_KEY$REQUESTY_API_KEY$NVIDIA_API_KEY$MISTRAL_API_KEY$OPENROUTER_API_KEY$ZAI_API_KEY$DEEPSEEK_API_KEY" ]; then echo "::warning::No AI key is set (GROQ_API_KEY, GEMINI_API_KEY, REQUESTY_API_KEY, NVIDIA_API_KEY, MISTRAL_API_KEY, OPENROUTER_API_KEY, ZAI_API_KEY or DEEPSEEK_API_KEY): articles will be scraped but not analyzed."; fi

      - name: Apply database migrations
        id: migrate
        env:
          # DDL is safer over a session connection (port 5432); falls back to DATABASE_URL.
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL }}
        run: npm run db:migrate

      # Tells the Supabase fallback (supabase/pipeline-fallback.sql) and the watchdog that a run
      # started, so the database only asks GitHub for a run when none started for an hour.
      - name: Record the run's start
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        run: npm run pipeline:mark

      - name: Cache Playwright Chromium
        # The cache and the browser install are conveniences for the browser pass only: when either
        # fails (cache service change, apt mirror down) the HTTP pass still runs, with --no-browser.
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (for JavaScript-rendered sites)
        id: chromium
        continue-on-error: true
        # Dependency install scripts never see a secret (a compromised package could send them out).
        env:
          DATABASE_URL: ""
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          REQUESTY_API_KEY: ""
          NVIDIA_API_KEY: ""
          MISTRAL_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ZAI_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          GROK_API_KEY: ""
          FB_PAGE_TOKEN: ""
          THREADS_TOKEN: ""
          INSTAGRAM_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DISCORD_BOT_TOKEN: ""
          DISCORD_CHANNEL_ID: ""
        run: npx playwright install --with-deps chromium

      - name: Scrape government sources
        # Runs whenever the schema is current, even if the Chromium install failed (HTTP pass only).
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        # Inputs go through env vars, never straight into the script (prevents injection).
        env:
          IN_SOURCES: ${{ inputs.sources }}
          IN_LIMIT: ${{ inputs.limit || '8' }}
          IN_DAYS: ${{ inputs.days }}
          BROWSER_OK: ${{ steps.chromium.outcome == 'success' }}
        run: |
          case "$IN_LIMIT" in ''|*[!0-9]*) IN_LIMIT=8 ;; esac
          case "$IN_DAYS" in ''|*[!0-9]*) IN_DAYS="" ;; esac
          args=(--limit "$IN_LIMIT" --budget 30)
          if [ -n "$IN_DAYS" ]; then args=(--limit "$IN_LIMIT" --budget 50 --days "$IN_DAYS"); fi
          if [ -n "$IN_SOURCES" ]; then args+=(--source "$IN_SOURCES"); fi
          if [ "$BROWSER_OK" != "true" ]; then echo "::warning::Chromium is not available: JavaScript-rendered sites are skipped this run."; args+=(--no-browser); fi
          npm run scrape -- "${args[@]}"

      - name: Analyze with AI (free providers first, paid ones within budget)
        # From here on every step runs even when an earlier one failed (a scrape or AI outage must
        # never stop the digest, its rule-based fallback or the pushes), but never on an old schema.
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && (env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '' || env.REQUESTY_API_KEY != '' || env.NVIDIA_API_KEY != '' || env.MISTRAL_API_KEY != '' || env.OPENROUTER_API_KEY != '' || env.ZAI_API_KEY != '' || env.DEEPSEEK_API_KEY != '') }}
        env:
          IN_AI_LIMIT: ${{ inputs.ai_limit || '60' }}
        run: |
          case "$IN_AI_LIMIT" in ''|*[!0-9]*) IN_AI_LIMIT=60 ;; esac
          # Stop starting new articles after 75 min; the rest wait for the next run.
          npm run ai:process -- --limit "$IN_AI_LIMIT" --budget 75

      - name: Tag older articles with an AI topic (batched, free tier)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && (env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '' || env.REQUESTY_API_KEY != '' || env.NVIDIA_API_KEY != '' || env.MISTRAL_API_KEY != '' || env.OPENROUTER_API_KEY != '' || env.ZAI_API_KEY != '' || env.DEEPSEEK_API_KEY != '') }}
        # A no-op once every article has a topic (Tier 1 returns one for new articles).
        continue-on-error: true
        run: npm run ai:topics -- --limit 200

      - name: Plain headlines and "Танд хамаатай юу?" for older stories (batched, free tier)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && (env.GROQ_API_KEY != '' || env.GEMINI_API_KEY != '' || env.REQUESTY_API_KEY != '' || env.NVIDIA_API_KEY != '' || env.MISTRAL_API_KEY != '' || env.OPENROUTER_API_KEY != '' || env.ZAI_API_KEY != '' || env.DEEPSEEK_API_KEY != '') }}
        # A no-op once last month's feed stories have one (Tier 1 writes them for new articles).
        continue-on-error: true
        run: npm run ai:reader -- --limit 64

      - name: Match the press's headlines with government stories (ikon.mn, news.mn, sonin.mn)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        # Headlines and links only; a failing feed is a warning. Never fails the pipeline.
        continue-on-error: true
        run: npm run press:sync

      - name: Notify subscribers about important news
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        # Push problems must never fail the pipeline.
        continue-on-error: true
        run: npm run push:send -- --mode news

      - name: Post the most important new story to Facebook, Threads, Instagram, Telegram and Discord
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && (env.FB_PAGE_TOKEN != '' || env.THREADS_TOKEN != '' || env.INSTAGRAM_TOKEN != '' || env.TELEGRAM_BOT_TOKEN != '' || env.DISCORD_BOT_TOKEN != '') }}
        continue-on-error: true
        run: npm run social:post -- --mode news

      - name: Write the 12h digest when it is due (morning / evening window)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        # news-digest.yml starts hours late on GitHub's scheduler, so every pipeline run checks
        # whether an edition is due (src/lib/ai/digest.ts isDigestDue) and writes it here.
        continue-on-error: true
        run: npm run digest -- --due

      - name: Notify subscribers about a new digest
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        run: npm run push:send -- --mode digest

      - name: Post the new digest to Facebook, Threads, Instagram, Telegram and Discord
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && (env.FB_PAGE_TOKEN != '' || env.THREADS_TOKEN != '' || env.INSTAGRAM_TOKEN != '' || env.TELEGRAM_BOT_TOKEN != '' || env.DISCORD_BOT_TOKEN != '') }}
        continue-on-error: true
        run: npm run social:post -- --mode digest

      # The videos' main clock (GitHub starts video.yml hours late): inside a slot (12–16, 19–23
      # Ulaanbaatar) with no video yet, make one here, then post any video not yet posted.
      - name: Make the slot's video (12–16 money, 19–23 prices)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && steps.chromium.outcome == 'success' && vars.VIDEO_POSTING != 'off' && env.GEMINI_API_KEY != '' }}
        continue-on-error: true
        env:
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          npm run video:make -- --slot

      - name: Post a video not yet posted (Facebook / Instagram Reels, Threads)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && vars.VIDEO_POSTING != 'off' && (env.FB_PAGE_TOKEN != '' || env.THREADS_TOKEN != '' || env.INSTAGRAM_TOKEN != '') }}
        continue-on-error: true
        run: npm run social:post -- --mode video
