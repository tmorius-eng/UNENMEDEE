# Data syncs twice a day (opendata.mn, Mongolbank, budget, retention pruning) plus the AI news
# digest ("Онцлох тойм") when it is due. GitHub starts this schedule ~4.5 h late (12:30 and 01:00
# Ulaanbaatar), so the 12h edition is normally written by the 2-hourly pipeline inside the
# morning/evening window (`npm run digest -- --due`); a manual run with force=true still writes
# one at once. It has its own concurrency group because GitHub cancels a pending run when
# another one queues in the same group.
name: News digest (12h)

on:
  schedule:
    - cron: "7 0,12 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "12h = regular edition, 30d = review of the last 30 days"
        required: false
        default: "12h"
      force:
        description: "Make a new edition even if one was made in the last hours (true/false)"
        required: false
        default: "false"

concurrency:
  group: news-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    # Forks keep the code but never run the scheduled jobs (no secrets, no Actions minutes).
    if: github.repository == 'tmorius-eng/UNENMEDEE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # "true" only for a key from a Google project WITHOUT billing; otherwise Gemini is skipped.
      GEMINI_FREE_TIER: ${{ vars.GEMINI_FREE_TIER }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}
      AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
      AI_TIER2_CHAIN: ${{ vars.AI_TIER2_CHAIN }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_DEEP_MODEL: ${{ vars.GEMINI_DEEP_MODEL }}
      REQUESTY_MODEL: ${{ vars.REQUESTY_MODEL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      # Facebook page posting (docs/FACEBOOK.md); both unset = the steps are skipped.
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret (Settings → Secrets → Actions)."; exit 1; fi

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Trim article bodies older than 180 days (keeps the free 500 MB database from filling)
        continue-on-error: true
        run: npm run db:prune

      - name: Sync opendata.mn datasets
        # Data problems must never block the news digest.
        continue-on-error: true
        run: npm run data:sync

      - name: Sync Mongolbank indicators (policy rate, inflation, FX, gold, reserves)
        continue-on-error: true
        run: npm run macro:sync

      - name: Sync budget data (NSO, Шилэн данс, World Bank, audit.mn)
        continue-on-error: true
        env:
          # audit.mn does not send its RapidSSL intermediate; trust DigiCert's public one (verification stays on).
          NODE_EXTRA_CA_CERTS: certs/rapidssl-tls-rsa-ca-g1.pem
        run: npm run budget:sync

      - name: Write the digest
        env:
          IN_KIND: ${{ inputs.kind || '12h' }}
          IN_FORCE: ${{ inputs.force || 'false' }}
        run: |
          case "$IN_KIND" in 30d) ;; *) IN_KIND=12h ;; esac
          if [ "$IN_FORCE" = "true" ]; then
            npm run digest -- --kind "$IN_KIND" --force
          else
            npm run digest -- --kind "$IN_KIND" --due
          fi

      - name: Notify subscribers about the new digest
        continue-on-error: true
        run: npm run push:send -- --mode digest

      - name: Post the new digest to the Facebook page
        if: env.FB_PAGE_ID != '' && env.FB_PAGE_TOKEN != ''
        continue-on-error: true
        run: npm run social:post -- --mode digest
