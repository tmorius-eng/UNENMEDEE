<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Интернэт алга · ИЛ ТОД</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f9fafb; color: #101828; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #0c111d; color: #f5f5f6; } p { color: #94969c; } }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { margin: 0 0 20px; color: #475467; line-height: 1.5; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 20px; background: #155eef; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Интернэт холболт алга</h1>
      <p>Холболт сэргэмэгц хамгийн сүүлийн мэдээ шууд ачаална.</p>
      <button onclick="location.reload()">Дахин оролдох</button>
    </main>
  </body>
</html>
